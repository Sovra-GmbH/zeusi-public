# Template for ~/.pg_service.conf (PLAN.md KTD11). the operator places the real file on each
# machine, outside every repo, mode 0600. Hostnames come from the 1Password item;
# never put them in this repo or the vault. NO passwords here: the Mini reads them
# from the Keychain item zeusi-neon-<role> (account <role>); the box uses ~/.pgpass.
# Zeusi refuses any service without these three TLS lines.

# Mini — importers, `zeusi doctor`, `wall report/audit` (DIRECT endpoint: pooled host without "-pooler").
# The vault importer holds a SESSION advisory lock (one run at a time), which does not hold
# over the pooler (PgBouncer transaction mode). `ingest vault --real` refuses a "-pooler" host
# offline. Direct connections only, one importer run at a time.
[zeusi_ingest]
host=<direct-host>
port=5432
dbname=<database>
user=zeusi_mini_ingest
sslmode=verify-full
sslrootcert=system
channel_binding=require

# Mini — pg_dump (U11) and `zeusi doctor --roles` (DIRECT endpoint: pooled host without "-pooler")
[zeusi_backup]
host=<direct-host>
port=5432
dbname=<database>
user=zeusi_mini_backup
sslmode=verify-full
sslrootcert=system
channel_binding=require

# Box — Zeus writes / other agents read (pooled endpoint: short transactions, no session state)
[zeusi_rw]
host=<pooled-host>
port=5432
dbname=<database>
user=zeusi_box_rw
sslmode=verify-full
sslrootcert=system
channel_binding=require

# Box — MCP zeusi_log_decision only (migrations/0012, NOT applied yet: this login does not exist on
# Neon until the operator applies 0012 and sets its password). Pooled. Password: Keychain
# zeusi-neon-zeusi_box_decision (account zeusi_box_decision) or ~/.pgpass. No env password, no
# serverless transport: TCP with channel binding only. Until 0012: the transitional [zeusi_rw].
[zeusi_decision]
host=<pooled-host>
port=5432
dbname=<database>
user=zeusi_box_decision
sslmode=verify-full
sslrootcert=system
channel_binding=require

# Box — read-only search (`zeusi search`, `zeusi doctor --roles --service zeusi_ro`), pooled.
# Password: ~/.pgpass, or (ONLY for zeusi_box_ro) the env var ZEUSI_NEON_BOX_RO_PASSWORD (docs/roles.md).
# A box without TCP 5432 egress uses this same section with ZEUSI_TRANSPORT=serverless in the env
# (wss, port 443; search and read-only doctor only). There is no service-file key for it (docs/neon.md).
[zeusi_ro]
host=<pooled-host>
port=5432
dbname=<database>
user=zeusi_box_ro
sslmode=verify-full
sslrootcert=system
channel_binding=require
